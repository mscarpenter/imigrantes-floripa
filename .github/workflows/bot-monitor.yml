name: Bot — monitoria

on:
  schedule:
    # Diário 06:00 BRT (09:00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const botWorkflows = [
              "Bot — validar rascunhos",
              "Bot — pesquisar e checar contatos",
              "Bot — pesquisar cursos",
            ];
            const since = new Date(Date.now() - 8 * 24 * 60 * 60 * 1000).toISOString();
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 50,
              created: `>=${since}`,
            });
            const latestByWorkflow = new Map();
            for (const r of runs.workflow_runs) {
              if (!botWorkflows.includes(r.name ?? "") || r.status !== "completed") {
                continue;
              }
              if (!latestByWorkflow.has(r.name)) {
                latestByWorkflow.set(r.name, r);
              }
            }
            const failed = [...latestByWorkflow.values()].filter(
              (r) => r.conclusion === "failure",
            );
            if (failed.length === 0) {
              core.info("Nenhuma falha no último run de cada workflow do bot.");
              return;
            }
            const { data: recentIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "all",
              labels: "bot,monitor",
              per_page: 20,
            });
            const unnotifiedFailed = failed.filter(
              (r) => !recentIssues.some((i) => (i.body ?? "").includes(r.html_url)),
            );
            if (unnotifiedFailed.length === 0) {
              core.info("Falhas atuais já foram reportadas em issue anterior — não duplicar.");
              return;
            }
            const lines = unnotifiedFailed.map(
              (r) => `- ${r.name} (#${r.run_number}) — ${r.html_url}`,
            );
            const title = "Bot: falhas recentes nos jobs automatizados";
            const body = [
              "Um ou mais workflows do bot falharam em sua execução mais recente:",
              "",
              ...lines,
              "",
              "Revise os logs no GitHub Actions e corrija ou dispense conscientemente.",
            ].join("\n");
            if (recentIssues.some((i) => i.state === "open" && i.title === title)) {
              core.info("Issue de monitoria já aberta — não duplicar.");
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["bot", "monitor"],
            });
